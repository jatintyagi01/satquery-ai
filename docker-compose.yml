version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports_out:/app/reports_out
      - ./backend/data:/app/data
      - ./models:/app/models
    environment:
      - SATQUERY_CORS_ORIGINS=http://localhost:5173,http://localhost:80
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
